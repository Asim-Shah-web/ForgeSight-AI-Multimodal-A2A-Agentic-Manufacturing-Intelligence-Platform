# ForgeSight AI - Agent configuration (Phase 6 topology, Phase 11 implementation)
llm:
  provider: groq
  default_model: llama-3.3-70b-versatile
  temperature: 0.1
  max_tokens: 2048

agent_models:
  EvidenceCorrelationAgent: llama-3.3-70b-versatile
  HypothesisRankingAgent: llama-3.3-70b-versatile
  CorrectiveActionAgent: llama-3.3-70b-versatile
  ReportGenerationAgent: llama-3.1-8b-instant

orchestrator:
  system_role_username: forgesight-orchestrator-system
  max_stage_retries: 2
  stage_timeout_seconds: 60

checkpointing:
  backend: postgres
