# ForgeSight AI - local development infrastructure
#
# Default usage (lightweight — recommended if you're short on disk space):
#   docker compose up -d db redis
#   pip install -e ".[dev]"
#   alembic upgrade head
#   python scripts/seed_database.py
#   uvicorn forgesight.api.main:app --reload
#
# Full containerized stack (heavier — needs ~2GB extra for the app image,
# mostly torch/ultralytics/sentence-transformers):
#   docker compose --profile full up -d

services:
  db:
    image: pgvector/pgvector:pg15
    container_name: forgesight-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: forgesight
      POSTGRES_PASSWORD: changeme
      POSTGRES_DB: forgesight
    ports:
      - "5432:5432"
    volumes:
      - forgesight_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U forgesight" ]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: forgesight-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - forgesight_redisdata:/data
    healthcheck:
      test: [ "CMD", "redis-cli", "ping" ]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: forgesight-app
    profiles: [ "full" ] # only starts with --profile full
    restart: unless-stopped
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql+psycopg://forgesight:changeme@db:5432/forgesight
      REDIS_URL: redis://redis:6379/0
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - "8000:8000"
    volumes:
      - ./data:/app/data
      - ./models:/app/models

volumes:
  forgesight_pgdata:
  forgesight_redisdata:
